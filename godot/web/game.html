<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
<script>/* Capture only this game's AudioContexts so a real click can unlock Web Audio. */
(() => {
  const contexts = [];
  const outputs = [];
  const debug = new URLSearchParams(location.search).has('audio_debug');
  let active = false, muted = false, silentRequested = false, peak = 0;
  const Base = window.AudioContext || window.webkitAudioContext;
  const ready = () => contexts.length > 0 && contexts.every(c => c.state === 'running');
  function update() {
    const gate = document.getElementById('audio-unlock');
    if (gate) gate.hidden = !active || muted || ready();
    const status = document.getElementById('audio-check');
    if (status && debug) {
      let rms = 0;
      for (const analyser of outputs) {
        const data = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(data);
        rms = Math.max(rms, Math.sqrt(data.reduce((sum, v) => sum + v * v, 0) / data.length));
      }
      peak = Math.max(peak, rms);
      status.dataset.context = contexts.map(c => c.state).join(',');
      status.dataset.rms = rms.toFixed(6);
      status.dataset.peak = peak.toFixed(6);
    }
  }
  if (Base) {
    window.AudioContext = new Proxy(Base, {
      construct(target, args) {
        const context = new target(...args);
        contexts.push(context);
        context.addEventListener('statechange', update);
        return context;
      }
    });
  }
  // Optional local verification observes output energy; never records microphone input.
  if (debug && window.AudioNode) {
    const connect = AudioNode.prototype.connect;
    AudioNode.prototype.connect = function(destination, ...args) {
      const result = connect.call(this, destination, ...args);
      if (destination === this.context.destination) {
        const analyser = this.context.createAnalyser();
        analyser.fftSize = 256;
        connect.call(this, analyser);
        outputs.push(analyser);
      }
      return result;
    };
  }
  function unlock() {
    for (const context of contexts) {
      if (context.state === 'suspended') context.resume().then(() => { update(); if (active && ready()) document.getElementById('canvas')?.focus(); }).catch(update);
    }
    update();
  }
  window.GuangongAudio = {
    isReady: ready,
    request: unlock,
    setActive(value, silent) { if (active === value && muted === silent) return; active = value; muted = silent; update(); },
    consumeSilent() { const value = silentRequested; silentRequested = false; return value; }
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('enable-audio').addEventListener('click', () => {
      unlock();
      if (ready()) document.getElementById('canvas').focus();
    });
    document.getElementById('silent-prologue').addEventListener('click', () => {
      silentRequested = true;
      document.getElementById('audio-unlock').hidden = true;
      document.getElementById('canvas').focus();
    });
    if (debug) setInterval(update, 100);
  });
})();
</script>
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#audio-unlock[hidden] { display: none; }
#audio-unlock { position:fixed; z-index:20; inset:0; display:grid; place-content:center; gap:12px; background:rgba(6,18,15,.78); text-align:center; font:18px system-ui,sans-serif; }
#audio-unlock p { margin:0 24px 12px; color:#eee4ca; }
#audio-unlock button { min-width:230px; min-height:48px; padding:8px 24px; border:1px solid #c7ac70; border-radius:4px; background:#d5ba7e; color:#10241b; font:18px system-ui,sans-serif; cursor:pointer; }
#audio-unlock #silent-prologue { background:#142b23; color:#e9dec3; }
</style>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>


<div id="audio-unlock" role="dialog" aria-label="开启声音" hidden>
<p>开启中文说书旁白</p>
<button id="enable-audio" type="button">开启声音</button>
<button id="silent-prologue" type="button">静音观看</button>
</div>
<output id="audio-check" hidden></output>

<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
